# Arc Replay — serveur (Pi 5, mini-PC, portable…)
#   docker compose up -d                    # serveur seul
#   docker compose --profile audio up -d    # + détection du lâcher au micro
# Interface : http://<adresse-du-serveur>/ (écran) et /telecommande

name: arc-replay

x-commun: &commun
  restart: unless-stopped
  environment:
    TZ: ${TZ:-Europe/Paris}

services:
  mediamtx:
    <<: *commun
    image: bluenviron/mediamtx:${MEDIAMTX_TAG:-1.21.2-ffmpeg}
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - enregistrements:/recordings
      # Caméras USB : /dev complet pour suivre les branchements à chaud
      - /dev:/dev
    device_cgroup_rules:
      - "c 81:* rmw"    # caméras V4L2 (/dev/video*)
      - "c 226:* rmw"   # GPU pour l'encodage VAAPI (/dev/dri)
    ports:
      - "8554:8554"     # RTSP : les nœuds caméra (Pi Zero, Pi 4) publient ici
      # WebRTC (vue cible en direct, caméra d'un téléphone) : la vidéo passe par
      # le port ICE 8189, en UDP (et TCP en secours). Le signalement (offre SDP)
      # passe par nginx (/webrtc/) ; 8889 reste publié pour les tests directs.
      - "8889:8889"
      - "8189:8189/udp"
      - "8189:8189"

  backend:
    <<: *commun
    image: ${ARC_REGISTRE:-local}/arc-replay-backend:${ARC_VERSION:-latest}
    build: ./backend
    depends_on: [mediamtx]
    volumes:
      - ./config:/config:ro
      - donnees:/data
      # Enregistrements bruts : le back-end les purge au démarrage et en fin de séance
      - enregistrements:/recordings
      # Clé USB montée par l'hôte dans /media/arc-usb (voir docs/installation.md).
      # rslave : le conteneur voit la clé même si elle est branchée après le démarrage.
      - /media:/media/hote:rslave

  frontend:
    <<: *commun
    image: ${ARC_REGISTRE:-local}/arc-replay-frontend:${ARC_VERSION:-latest}
    build: ./frontend
    depends_on: [backend, mediamtx]
    volumes:
      - donnees:/data:ro   # nginx sert directement les clips
    ports:
      - "${ARC_PORT:-80}:80"
      - "${ARC_PORT_HTTPS:-443}:443"   # requis pour ouvrir la caméra d'un téléphone (voir /camera)

  detecteur-lacher:
    <<: *commun
    profiles: [audio]
    image: ${ARC_REGISTRE:-local}/arc-replay-detecteur:${ARC_VERSION:-latest}
    build: ./detecteur-lacher
    depends_on: [backend]
    devices:
      - /dev/snd:/dev/snd
    environment:
      TZ: ${TZ:-Europe/Paris}
      ARC_SERVEUR: http://backend:8000
      SEUIL_DB: ${SEUIL_DB:--20}
      PERIPHERIQUE_AUDIO: ${PERIPHERIQUE_AUDIO:-}

volumes:
  enregistrements:
  donnees:
