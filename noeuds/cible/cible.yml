# Nœud cible Arc Replay
serveur: 10.42.0.1          # adresse du serveur (point d'accès Wi-Fi du Pi 5)
chemin: cible               # = id de la caméra dans config/arc-replay.yml

# Flux vidéo envoyé à la mosaïque.
# Sur Pi 3B+ (encodeur matériel partagé avec les caméras USB du serveur),
# rester en 720p : 1920x1080 consomme à lui seul le budget H.264 du GPU.
largeur: 1280
hauteur: 720
fps: 30
debit: 3000000

# Zoom numérique sur le capteur (1 = aucun). La caméra HQ (IMX477, 12 MP)
# avec le téléobjectif 25 mm placée au pas de tir à 18 m ne cadre le blason
# que sur ~27 % de l'image ; zoom_numerique: 3 le fait passer à ~80 %,
# ce qui remplit la vue et surtout donne à la détection d'impact des pixels
# assez fins (lores 640x480 → ~2,4 mm/pixel sur le blason au lieu de ~7).
# La calibration (calibrer.py) applique le même zoom : à refaire si changé.
zoom_numerique: 3

# Analyse : images basse définition en niveaux de gris
lores: [640, 480]           # la calibration est faite à cette résolution
analyse_fps: 4
calibration: /opt/arc-replay/cible/calibration.json
attente_apres_lacher_s: 2.5 # temps de vol + vibration du tube (70 m : ~1 s de vol)

# Côté de la zone détectée où se trouve l'entrée dans le blason.
# Le tube dépasse vers la caméra : caméra sous la cible -> « haut »,
# caméra au-dessus -> « bas ». À vérifier avec une flèche plantée à la main.
extremite: haut
seuil: 30                   # sensibilité (plus bas = plus sensible)
aire_min: 30                # taille minimale d'une zone, en pixels
