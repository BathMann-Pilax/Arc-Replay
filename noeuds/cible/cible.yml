# Nœud cible Arc Replay
serveur: 10.42.0.1          # adresse du serveur ; 127.0.0.1 si serveur et cible sont sur le même Pi
chemin: cible               # = id de la caméra dans config/arc-replay.yml

# false : « cible directe » — vue en direct cadrée depuis la télécommande,
#         sans OpenCV ni détection d'impact (Pi 3 B+ qui fait aussi serveur).
# true  : détection d'impact (reportée pour l'instant, voir docs/noeud-cible.md).
detection: false

# --- Mode « cible directe » ----------------------------------------------------
# Capteur, résolution, cadence, débit et pas du cadrage se règlent dans
# config/arc-replay.yml (caméra « cible ») : le serveur les envoie au nœud.
# Les valeurs ci-dessous ne servent que si le serveur ne répond pas au démarrage.
capteur: complet            # complet : 4056x3040 à 10 i/s ; binne : 2028x1520 à 30 i/s
largeur: 1920
hauteur: 1080
debit: 4000000
fichier_cadrage: /var/lib/arc-replay/cadrage-cible.json   # cadrage restauré au démarrage

# --- Mode détection (detection: true) --------------------------------------------
# Zoom numérique fixe sur le capteur (1 = aucun). La caméra HQ placée au pas
# de tir à 18 m ne cadre le blason que sur une petite part de l'image ;
# zoom_numerique: 3 le fait passer à ~80 % et donne à la détection des pixels
# plus fins. La calibration (calibrer.py) applique le même zoom : à refaire si changé.
zoom_numerique: 3

# Analyse : images basse définition en niveaux de gris
lores: [640, 480]           # la calibration est faite à cette résolution
analyse_fps: 4
calibration: /opt/arc-replay/cible/calibration.json
attente_apres_lacher_s: 2.5 # temps de vol + vibration du tube (70 m : ~1 s de vol)

# Côté de la zone détectée où se trouve l'entrée dans le blason.
# Le tube dépasse vers la caméra : caméra sous la cible -> « haut »,
# caméra au-dessus -> « bas ». À vérifier avec une flèche plantée à la main.
extremite: haut
seuil: 30                   # sensibilité (plus bas = plus sensible)
aire_min: 30                # taille minimale d'une zone, en pixels
