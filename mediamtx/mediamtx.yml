# Configuration MediaMTX du serveur Arc Replay.
# Les chemins (une entrée par caméra) sont créés au démarrage par le back-end
# via l'API de contrôle, à partir de config/arc-replay.yml.

logLevel: info

# Réseau local fermé : tout le monde peut publier, lire et rejouer.
# Ne pas exposer ce serveur sur internet sans ajouter d'authentification.
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api

# API de contrôle (utilisée par le back-end pour créer les chemins)
api: yes
apiAddress: :9997

# Serveur de relecture : découpe des clips dans les enregistrements
playback: yes
playbackAddress: :9996

# RTSP : les nœuds caméra publient ici, les caméras USB aussi (via ffmpeg)
rtsp: yes
rtspAddress: :8554

rtmp: no
srt: no

# WebRTC/WHIP : un téléphone peut publier sa caméra depuis le navigateur
# (frontend/src/Camera.jsx, proxifié par nginx sur /webrtc/). Sur le Raspberry Pi
# cible, ce service doit voir le réseau de l'hôte (network_mode: host) pour que
# l'ICE UDP fonctionne ; sous Docker Desktop (macOS), l'ICE peut être capricieux,
# c'est une limite connue de l'environnement de dev, pas du design.
webrtc: yes
webrtcAddress: :8889

moq: no    # supprimer cette ligne si une ancienne version de MediaMTX la refuse

# HLS : flux lus par l'écran avec un retard. La fenêtre doit dépasser le
# délai maximal (30 s) : 40 segments d'une seconde.
# hlsAlwaysRemux garde la fenêtre à jour même sans spectateur, pour que
# l'écran ait immédiatement 10 s d'historique à l'ouverture.
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsVariant: fmp4
hlsSegmentCount: 40
hlsSegmentDuration: 1s

pathDefaults:
  # Enregistrement continu en fichiers d'une minute, purgés après 5 min :
  # juste de quoi découper le clip de chaque flèche (extrait dans /data).
  # Le back-end vide aussi ce dossier au démarrage et en fin de séance.
  record: yes
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f_%z
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 1m
  recordDeleteAfter: 5m

paths:
  all_others:
