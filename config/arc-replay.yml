# Configuration d'Arc Replay
# Après modification : bouton « Recharger la configuration » dans la télécommande,
# ou `docker compose restart backend`.

serveur:
  delai_s: 10               # retard d'affichage par défaut (3 à 30 s)
  lateralite: droitier      # droitier | gaucher
  usb_chemin: /media/hote/arc-usb   # point de montage de la clé, vu depuis le conteneur
  usb_verifier_montage: true        # false pour tester l'export sans vraie clé
  # code_telecommande: "4821"       # exige ce code pour piloter (utile si le serveur est sur le réseau du club)
  alerte_espace_go: 2               # alerte dans la télécommande sous cet espace libre

volees:
  fleches_par_volee: 6      # au-delà, la flèche suivante ouvre une nouvelle volée
  nouvelle_apres_s: 90      # pause sans tir au-delà de laquelle on change de volée

clips:
  avant_s: 6                # secondes conservées avant le lâcher
  apres_s: 3                # secondes conservées après le lâcher
  marge_s: 2                # attente avant la découpe (écriture des enregistrements)

lacher:
  anti_rebond_s: 2          # ignore un second lâcher détecté trop tôt
  decalage_manuel_s: 1.0    # bouton « marquer » : le tir a eu lieu ~1 s avant l'appui

# Blason par défaut (se change aussi depuis la télécommande, section Score)
blason:
  diametre_mm: 1220         # blason complet de référence : 400 pour un 40 cm comme pour un trispot 40
  zone_min: 1               # zone la plus basse imprimée : 1 complet, 5 pour le 80 cm réduit, 6 trispot
  disposition: simple       # simple | trispot_vertical | trispot_triangle
  # ecart_mm: 220           # trispot : distance entre les centres des spots
  poulies: false            # arc à poulies : 10 réduit

# Liste des caméras. L'ordre ici est l'ordre par défaut dans la mosaïque.
# Types :
#   usb    : caméra branchée sur le serveur (lue et encodée par MediaMTX via ffmpeg)
#   reseau : nœud Raspberry Pi qui publie lui-même son flux vers le serveur
#   rtsp   : caméra IP du commerce que le serveur va chercher
cameras:
  - id: profil
    nom: Profil
    type: usb
    peripherique: /dev/v4l/by-id/usb-REMPLACER-video-index0
    format_entree: mjpeg    # mjpeg | h264 | yuyv422
    largeur: 1280
    hauteur: 720
    fps: 30
    encodeur: libx264       # libx264 | copy (caméra H.264) | vaapi (Intel N100) | v4l2m2m (Pi 4)
    debit: 4M

  - id: face
    nom: Face (ralenti)
    type: usb
    peripherique: /dev/v4l/by-id/usb-REMPLACER-video-index0
    format_entree: mjpeg
    largeur: 1280
    hauteur: 720
    fps: 100                # 100 fps en salle (éclairage 50 Hz), 120 fps en extérieur
    encodeur: libx264
    debit: 10M
    ralenti: true

  - id: arriere
    nom: Arrière
    type: usb
    peripherique: /dev/v4l/by-id/usb-REMPLACER-video-index0
    format_entree: mjpeg
    largeur: 1280
    hauteur: 720
    fps: 30
    encodeur: libx264
    debit: 4M

  - id: cible
    nom: Cible
    type: reseau            # publié par le Pi 4 du coffre de cible (noeuds/cible)
