server {
    listen 80;
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    # Redirections relatives : garde le port réel (ARC_PORT) au lieu de 80
    absolute_redirect off;

    ssl_certificate /etc/nginx/certs/arc-replay.crt;
    ssl_certificate_key /etc/nginx/certs/arc-replay.key;

    # Interface (écran et télécommande) : application monopage
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API et WebSocket du back-end
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        client_max_body_size 10m;   # photos d'impact envoyées par le nœud cible
    }

    # Flux HLS en direct (MediaMTX)
    location /hls/ {
        proxy_pass http://mediamtx:8888/;
        # MediaMTX redirige /camera/index.m3u8 vers /camera/index.m3u8?cookieCheck=1 :
        # on remet le préfixe /hls/ dans l'adresse de redirection.
        proxy_redirect / /hls/;
        proxy_http_version 1.1;
        proxy_buffering off;
        add_header Cache-Control "no-cache";
    }

    # Publication WebRTC/WHIP (caméra d'un téléphone, voir frontend/src/Camera.jsx)
    location /webrtc/ {
        proxy_pass http://mediamtx:8889/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Clips des flèches, lus directement sur le volume de données
    location /fichiers/ {
        alias /data/seances/;
        add_header Cache-Control "no-cache";
    }
}
